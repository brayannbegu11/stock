<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiwan IA Lab</title>
<meta name="author" content="Brayann Benavides">
<meta name="description" content="Laboratorio de pronóstico bursátil para TWSE y TPEx con control temporal estricto: listas semanales, backtest, revisión adversarial y límites. Español · English · 繁體中文.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400&display=swap">
<style>
/* ---------- tokens (dark-first) ---------- */
:root{
  --canvas:#0A0B0E; --surface:#0F1114; --surface-2:#15181D; --surface-3:#1B1F25;
  --line:#1F2329; --line-2:#2A2F37; --line-3:#3A404A;
  --ink:#F2F3F5; --ink-2:#C4C9D1; --fog:#8B929D; --ash:#5D646E;
  --accent:#E6B547; --accent-ink:#1A1300; --accent-dim:rgba(230,181,71,.13); --accent-line:rgba(230,181,71,.45);
  --up:#F26B5E; --down:#3FD48F; --up-dim:rgba(242,107,94,.13); --down-dim:rgba(63,212,143,.13);
  --warn:#E6B547; --warn-dim:rgba(230,181,71,.10);
  --q0:#7CC4F0; --q1:#B9A7F6; --a1:#8B929D;
  --sev-block:#F26B5E; --sev-high:#F5A27E; --sev-mid:#E6B547; --sev-low:#5D646E;
  --glow-a:rgba(230,181,71,.16); --glow-b:rgba(124,196,240,.10);
  --font-display:"Instrument Serif","Noto Serif TC",Georgia,"Times New Roman",serif;
  --font-sans:"Instrument Sans","Noto Sans TC",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-card:12px; --r-btn:6px;
  --gap-section:96px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --canvas:#F7F7F5; --surface:#FFFFFF; --surface-2:#F1F1EE; --surface-3:#E9E9E4;
    --line:#E5E5E0; --line-2:#D6D6CF; --line-3:#BDBDB4;
    --ink:#111317; --ink-2:#3A3F47; --fog:#6B717B; --ash:#9AA0A8;
    --accent:#A8761A; --accent-ink:#FFFFFF; --accent-dim:rgba(168,118,26,.12); --accent-line:rgba(168,118,26,.45);
    --up:#C9372B; --down:#1C8B5A; --up-dim:rgba(201,55,43,.10); --down-dim:rgba(28,139,90,.12);
    --warn:#A8761A; --warn-dim:rgba(168,118,26,.10);
    --q0:#1C7CB6; --q1:#6A4FC0; --a1:#7A808A;
    --sev-block:#B8281D; --sev-high:#D9573B; --sev-mid:#C9932A; --sev-low:#9AA0A8;
    --glow-a:rgba(168,118,26,.12); --glow-b:rgba(28,124,182,.08);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --canvas:#F7F7F5; --surface:#FFFFFF; --surface-2:#F1F1EE; --surface-3:#E9E9E4;
  --line:#E5E5E0; --line-2:#D6D6CF; --line-3:#BDBDB4;
  --ink:#111317; --ink-2:#3A3F47; --fog:#6B717B; --ash:#9AA0A8;
  --accent:#A8761A; --accent-ink:#FFFFFF; --accent-dim:rgba(168,118,26,.12); --accent-line:rgba(168,118,26,.45);
  --up:#C9372B; --down:#1C8B5A; --up-dim:rgba(201,55,43,.10); --down-dim:rgba(28,139,90,.12);
  --warn:#A8761A; --warn-dim:rgba(168,118,26,.10);
  --q0:#1C7CB6; --q1:#6A4FC0; --a1:#7A808A;
  --sev-block:#B8281D; --sev-high:#D9573B; --sev-mid:#C9932A; --sev-low:#9AA0A8;
  --glow-a:rgba(168,118,26,.12); --glow-b:rgba(28,124,182,.08);
  color-scheme:light;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *,*::before,*::after{transition:none!important;animation:none!important}}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-3);text-underline-offset:3px;text-decoration-thickness:1px;transition:text-decoration-color .15s}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:400;line-height:1.1;text-wrap:balance}
h1,h2{font-family:var(--font-display);letter-spacing:-.015em}
h1{font-size:clamp(2.6rem,5.4vw,4.4rem);line-height:1.02}
h1 em{font-style:italic;color:var(--accent)}
h2{font-size:clamp(1.9rem,3.2vw,2.6rem)}
h3{font-family:var(--font-sans);font-weight:500;font-size:1.05rem;letter-spacing:-.005em}
h4{font-family:var(--font-sans);font-weight:500;font-size:.95rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-feature-settings:"zero"}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero","tnum"}
.label{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fog)}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fog)}
.dot.Q0{background:var(--q0)} .dot.Q1{background:var(--q1)} .dot.A1{background:var(--a1)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--fog)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--canvas) 78%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand .mark{width:22px;height:22px;border:1px solid var(--line-3);border-radius:6px;display:grid;place-items:center;font-family:var(--font-mono);font-size:.62rem;color:var(--accent);letter-spacing:0}
.brand b{font-weight:500;font-size:.92rem;letter-spacing:-.005em}
.brand span{font-family:var(--font-mono);font-size:.66rem;color:var(--fog);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:.84rem;color:var(--fog);text-decoration:none;padding:6px 10px;border-radius:var(--r-btn);white-space:nowrap;transition:color .15s,background .15s}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.controls{display:flex;gap:10px;align-items:center;flex-shrink:0}
.seg{display:inline-flex;gap:0;border:1px solid var(--line-2);border-radius:var(--r-btn);padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fog);font:inherit;font-size:.78rem;font-weight:500;padding:4px 10px;border-radius:4px;cursor:pointer;line-height:1.3;transition:color .15s,background .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--fog);width:30px;height:30px;border-radius:var(--r-btn);cursor:pointer;display:inline-grid;place-items:center;font-size:.85rem;transition:color .15s,border-color .15s}
.iconbtn:hover{color:var(--ink);border-color:var(--line-3)}

/* ---------- hero ---------- */
.hero{position:relative;padding:clamp(72px,10vw,128px) 0 clamp(40px,6vw,64px);border-bottom:1px solid var(--line);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;background-position:center top;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 100%);mask-image:radial-gradient(ellipse 70% 60% at 50% 0%,#000 20%,transparent 100%)}
.hero::after{content:"";position:absolute;inset:-20% -10% auto -10%;height:120%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 50% at 18% 10%,var(--glow-a),transparent 70%),radial-gradient(35% 45% at 85% 20%,var(--glow-b),transparent 70%)}
.hero .eyebrow{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .eyebrow i{display:inline-block;width:28px;height:1px;background:var(--accent-line)}
.hero h1{margin:22px 0 22px;max-width:19ch}
.hero .deck{font-size:1.1rem;color:var(--ink-2);max-width:60ch;line-height:1.6}
.readout{margin-top:44px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line-2);border-radius:var(--r-card);background:color-mix(in srgb,var(--surface) 80%,transparent);overflow:hidden}
.readout>div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.readout>div:first-child{border-left:0}
.readout .k{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fog)}
.readout .v{font-family:var(--font-sans);font-weight:500;font-size:1.55rem;letter-spacing:-.02em;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.readout .s{font-size:.78rem;color:var(--fog);margin-top:4px}
.verdict{margin-top:28px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:18px 22px;border:1px solid var(--line-2);border-radius:var(--r-card);background:var(--surface);position:relative;max-width:960px}
.verdict::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:var(--accent);border-radius:2px}
.verdict .tag{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-top:4px;white-space:nowrap}
.verdict p{color:var(--ink-2);max-width:80ch;font-size:1rem}

/* ---------- sections ---------- */
section.block{padding:var(--gap-section) 0;border-bottom:1px solid var(--line)}
section.block:last-of-type{border-bottom:0}
.sechead{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:36px;max-width:860px}
.sechead .label{margin-bottom:4px}
.sechead p{color:var(--fog);font-size:1.02rem;max-width:72ch;line-height:1.6}
.note{border:1px solid var(--line-2);border-radius:var(--r-card);padding:16px 18px;color:var(--fog);font-size:.95rem;background:var(--surface);max-width:900px}
.callout{position:relative;border:1px solid var(--line-2);border-radius:var(--r-card);padding:16px 20px 16px 22px;color:var(--ink-2);font-size:.95rem;background:var(--surface);max-width:960px}
.callout::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--warn);border-radius:2px}
.callout .tag{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);padding:20px 22px;min-width:0}
.card h3{margin-bottom:14px}
.cap{font-size:.82rem;color:var(--fog);margin-top:10px;line-height:1.5}

/* ---------- this week: board ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.col{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column}
.col header{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.col header .who{display:flex;align-items:center;gap:9px;font-weight:500;font-size:.98rem;letter-spacing:-.005em}
.col header .how{font-size:.82rem;color:var(--fog)}
.picks{list-style:none;margin:0;padding:0;flex:1}
.picks li{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line)}
.picks li:first-child{border-top:0}
.picks .sym{font-family:var(--font-mono);font-size:.9rem;color:var(--ink);font-feature-settings:"zero"}
.picks .nm{font-family:"Noto Sans TC",var(--font-sans);font-weight:500;font-size:1rem;line-height:1.25;overflow-wrap:anywhere}
.picks .mk{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;color:var(--fog);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px}
.col footer{padding:12px 18px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:.82rem;color:var(--fog);display:flex;flex-direction:column;gap:5px}
.col footer .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.col footer .row>span{flex:1;min-width:0}
.col footer .row b{color:var(--ink);font-weight:500;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--fog);white-space:nowrap;background:transparent}
.chip.ok{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,transparent);background:var(--down-dim)}
.chip.bad{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent);background:var(--up-dim)}
.chip.warn{color:var(--warn);border-color:var(--accent-line);background:var(--warn-dim)}
.chip.Q0{color:var(--q0);border-color:color-mix(in srgb,var(--q0) 45%,transparent)}
.chip.Q1{color:var(--q1);border-color:color-mix(in srgb,var(--q1) 45%,transparent)}
.chip.A1{color:var(--ink-2);border-color:var(--line-3)}

/* ---------- results ---------- */
.tabs{display:inline-flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding:3px;border:1px solid var(--line-2);border-radius:var(--r-card);background:var(--surface)}
.tab{border:1px solid transparent;background:transparent;color:var(--fog);border-radius:9px;padding:9px 14px;font:inherit;font-size:.88rem;font-weight:500;cursor:pointer;display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;transition:color .15s,background .15s}
.tab .sub{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.04em;font-weight:400;color:var(--ash)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface-3);color:var(--ink);border-color:var(--line-2)}
.tab[aria-selected="true"] .sub{color:var(--fog)}
.resgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:stretch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:var(--font-mono);font-weight:400;color:var(--fog);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.kpi{table-layout:fixed;min-width:540px}
.kpi td:first-child{color:var(--fog);font-size:.86rem}
.kpi col.lbl{width:36%}
.kpi td.num,.kpi th.num{white-space:nowrap;font-size:.9rem}
.kpi td.wrap{white-space:normal;line-height:1.35;font-size:.8rem}
.only-narrow{display:none}
.kcards{display:grid;grid-template-columns:1fr;gap:10px}
.kcard{border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.kcard h4{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kcard .kr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.86rem}
.kcard .kr span:first-child{color:var(--fog);flex:1}
.kcard .kr span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;max-width:55%}
.kcard .kr span:last-child .chip{white-space:normal;border-radius:6px;text-align:left}
.kpi td.wrap .chip{border-radius:6px}
details.orig{margin-top:6px}
details.orig summary{cursor:pointer;font-size:.8rem;color:var(--fog);list-style:none}
details.orig summary::before{content:"▸ ";color:var(--ash)}
details.orig[open] summary::before{content:"▾ "}
details.orig p{margin-top:6px}
.two ol li span{overflow-wrap:anywhere}
.kpi .chip{white-space:normal}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.8rem;color:var(--fog);margin-top:10px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-right:7px}
svg text{font-family:var(--font-mono);font-size:10.5px;fill:var(--fog);font-feature-settings:"zero"}
.weeks{margin-top:16px}
.weeks tbody tr.wk{cursor:pointer;transition:background .12s}
.weeks tbody tr.wk:hover td{background:var(--surface-2)}
.weeks tr.detail td{background:var(--surface-2);padding:14px 16px;border-bottom:1px solid var(--line)}
.weeks tr.detail[hidden]{display:none}
.weeks td.mono{font-size:.84rem}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dgrid .f{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px}
.dgrid .f h4{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dgrid ul{list-style:none;margin:0;padding:0;font-size:.86rem}
.dgrid li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:4px 0;align-items:baseline;border-top:1px solid var(--line)}
.dgrid li:first-child{border-top:0}
.dgrid li .nm{font-family:"Noto Sans TC",var(--font-sans);overflow-wrap:anywhere}
.caret{display:inline-block;transition:transform .15s;color:var(--ash);margin-right:2px;font-size:.8rem}
tr.wk.open .caret{transform:rotate(90deg)}

/* ---------- how it works ---------- */
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:8px 0 40px;position:relative}
.rail::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--line-2)}
.step{position:relative;padding:0 20px 0 0}
.step .pt{width:19px;height:19px;border-radius:50%;background:var(--canvas);border:1px solid var(--accent-line);display:grid;place-items:center;position:relative;z-index:1}
.step .pt::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.step .when{font-family:var(--font-mono);font-size:.68rem;color:var(--accent);margin-top:14px;letter-spacing:.08em;text-transform:uppercase}
.step h4{margin:6px 0 6px;font-size:1rem}
.step p{font-size:.88rem;color:var(--fog);line-height:1.5}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cards3 .card h3{display:flex;align-items:center;gap:9px}
.cards3 .card p{font-size:.92rem;color:var(--fog);line-height:1.55}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;margin-top:16px;max-width:1000px}
.ctl div{padding:16px 0;border-top:1px solid var(--line)}
.ctl b{display:block;font-weight:500;font-size:.98rem;margin-bottom:4px;letter-spacing:-.005em}
.ctl p{font-size:.9rem;color:var(--fog);line-height:1.5}
.roles{margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-2);border-radius:var(--r-card);overflow:hidden;max-width:1000px}
.roles div{padding:16px 18px;border-left:1px solid var(--line);font-size:.88rem;color:var(--fog);line-height:1.5}
.roles div:first-child{border-left:0}
.roles b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.subhead{display:flex;align-items:baseline;gap:14px;margin-top:56px}
.subhead h3{font-size:1.15rem}

/* ---------- review ---------- */
.rounds{margin-top:8px;border-top:1px solid var(--line)}
.round{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.round .n{font-family:var(--font-display);font-size:1.7rem;color:var(--ink);line-height:1;padding-top:2px}
.round .n small{font-family:var(--font-mono);font-size:.62rem;color:var(--ash);display:block;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}

/* ---------- state ---------- */
const state = {lang:"es", scenario:"standard", open:new Set()};
function detectLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q&&S[q]) return q; }catch(e){}
  try{ const v=localStorage.getItem("twlab.lang"); if(v&&S[v]) return v; }catch(e){}
  const n=(navigator.language||"es").toLowerCase();
  if(n.startsWith("zh")) return "zh"; if(n.startsWith("en")) return "en"; return "es";
}
function t(k){ const v=S[state.lang][k]; return v===undefined?S.es[k]:v; }
function verdictCounts(rounds){ const c={rechazado:0,aprobado_con_cambios:0,aprobado:0}; for(const r of rounds||[]){ const v=r.verdict in c?r.verdict:(r.verdict==="aceptado"?"aprobado":"rechazado"); c[v]++; } return c; }
function verdictText(vc){ vc=vc||{}; return t("verdict_counts")(vc.rechazado||0,vc.aprobado_con_cambios||0,vc.aprobado||0); }
function lastBlockingRound(rounds){ let lb=0; for(const r of rounds||[]){ if((r.severity||{}).bloqueante) lb=r.round; } return lb; }
function narrow(){ try{ return matchMedia("(max-width:700px)").matches; }catch(e){ return false; } }
function docTitle(d){
  const f=(d.file||"").split("/").pop(); const T=t("doc_titles");
  let m;
  if(/^00_perfil/.test(f)) return T.profile;
  if(/^01_entendimiento/.test(f)) return T.plan;
  if(/^02_auditoria/.test(f)) return T.audit;
  if((m=f.match(/respuesta_ronda(\d+)/))) return T.response(parseInt(m[1],10));
  if((m=f.match(/^10_censo_(\d{4}-\d{2}-\d{2})/))) return `${T.census} · ${m[1]}`;
  if(/^11_demo_q0/.test(f)) return T.demo;
  if(/^14_backtest_muestra/.test(f)) return T.sample;
  if(/^15c_/.test(f)) return T.longhist;
  if(/^15b_/.test(f)) return T.user;
  if(/^15_backtest_universo/.test(f)) return T.universe;
  return d.title;
}
function statusReason(x){ const SR=t("status_reason")||{}; const k=x.status_reason||x.status||""; return SR[k]||SR[String(k).split(":")[0]]||k; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- formatting ---------- */
function nf(x,d){ let o={minimumFractionDigits:d,maximumFractionDigits:d}; try{ o.useGrouping="always"; return new Intl.NumberFormat(LOC[state.lang],o).format(x); }catch(e){ delete o.useGrouping; return new Intl.NumberFormat(LOC[state.lang],o).format(x); } }
function pct(x,d,sign){ if(x==null||isNaN(x)) return "—"; d=d==null?2:d; const s=x<0?"−":(sign===false?"":(x>0?"+":"")); return s+nf(Math.abs(x*100),d)+(state.lang==="es"?" %":"%"); }
function pp(x,d){ if(x==null||isNaN(x)) return "—"; const s=x<0?"−":(x>0?"+":""); return s+nf(Math.abs(x*100),d==null?2:d); }
function twd(x){ if(x==null) return "—"; return state.lang==="es"? nf(x,0)+" TWD" : "NT$"+nf(x,0); }
function twdShort(x){ const a=Math.abs(x); if(a>=1e6) return nf(x/1e6,1)+"M"; if(a>=1e3) return nf(x/1e3,0)+"k"; return nf(x,0); }
function cls(x){ return x==null?"flat":x>0?"up":x<0?"down":"flat"; }
function arrow(x){ return x==null?"":x>0?"▲ ":x<0?"▼ ":""; }
function fmtDate(iso,opts){ if(!iso) return "—"; const d=new Date(iso); return new Intl.DateTimeFormat(LOC[state.lang],Object.assign({timeZone:"Asia/Taipei"},opts||{day:"numeric",month:"short",year:"numeric"})).format(d); }
function fmtDateTime(iso){ return fmtDate(iso,{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}); }
function fmtDay(iso){ return fmtDate(iso,{day:"numeric",month:"short"}); }
function fmtPlainDate(ymd){ if(!ymd) return "—"; return fmtDate(ymd+"T12:00:00+08:00",{day:"numeric",month:"short",year:"numeric"}); }

/* ---------- data helpers ---------- */
function scenario(id){ return (DATA.scenarios||[]).find(s=>s.id===id)||null; }
function anyScenario(){ return scenario("standard")||scenario("user")||(DATA.scenarios||[])[0]||null; }
function currentWeek(sc){ if(!sc) return null; const w=sc.weeks.filter(w=>w.pending_outcome); return w.length?w[w.length-1]:null; }
function gh(path){ return (DATA.repo||"#")+"/blob/main/"+path; }

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = state.lang==="zh"?"zh-Hant-TW":state.lang;
  const sc = scenario(state.scenario)||anyScenario();
  const base = scenario("standard")||anyScenario();
  const rounds = DATA.rounds||[];
  const cw = currentWeek(base);
  const html = [
    topbar(),
    hero(base,rounds),
    weekSection(base,cw),
    resultsSection(sc),
    howSection(),
    reviewSection(rounds),
    dataSection(base),
    limitsSection(),
    nextSection(),
    docsSection(),
    footer()
  ].join("");
  document.getElementById("app").innerHTML = html;
  wire();
}
function secHead(labelKey,titleHtml,sub){
  return `<div class="sechead"><div class="label">${esc(t(labelKey))}</div><h2>${titleHtml}</h2>${sub?`<p>${sub}</p>`:""}</div>`;
}
function topbar(){
  const nav = t("nav");
  const ids = {week:"semana",results:"resultados",how:"como-funciona",review:"revision",data:"datos",limits:"limites",next:"siguientes",docs:"documentos"};
  return `<header class="top"><div class="wrap">
    <a class="brand" href="#top"><span class="mark">TW</span><b>Taiwan IA Lab</b><span>${esc(t("brand_sub"))}</span></a>
    <nav class="nav" aria-label="${esc(t("nav_label"))}">${Object.keys(nav).map(k=>`<a href="#${ids[k]}">${esc(nav[k])}</a>`).join("")}</nav>
    <div class="controls">
      <div class="seg" role="group" aria-label="Idioma / Language / 語言">${Object.keys(S).map(l=>`<button type="button" data-lang="${l}" aria-pressed="${l===state.lang}" lang="${l==="zh"?"zh-Hant":l}" title="${l==="es"?"Español":l==="en"?"English":"繁體中文"}">${LANG_LABEL[l]}</button>`).join("")}</div>
      <button type="button" class="iconbtn" id="theme" title="${esc(t("theme"))}" aria-label="${esc(t("theme"))}">◐</button>
    </div>
  </div></header>`;
}
function hero(base,rounds){
  const weeks = base?base.weeks_operated:0;
  const cw = currentWeek(base);
  const tiles = [
    {k:t("st_week"), v:cw?cw.week_id:"—", s:cw?fmtDay(cw.cutoff_at):""},
    {k:t("st_weeks"), v:nf(weeks,0), s:t("st_weeks_s")},
    {k:t("st_universe"), v:base?nf(base.universe_size,0):"—", s:t("st_universe_s")},
    {k:t("st_tests"), v:DATA.tests!=null?nf(DATA.tests,0):"—", s:t("st_tests_s")},
    {k:t("st_rounds"), v:nf(rounds.length,0), s:t("st_rounds_s")(rounds.length,verdictCounts(rounds))},
    {k:t("st_updated"), v:fmtDate(DATA.generated_at,{day:"numeric",month:"short"}), s:fmtDate(DATA.generated_at,{hour:"2-digit",minute:"2-digit",hour12:false})+" Taipei"}
  ];
  const std = scenario("standard"), usr = scenario("user");
  const net = (sc,f)=> sc&&sc.forecasters[f]? sc.forecasters[f].mean_weekly_net : null;
  const v = {w:weeks, user:!!usr,
    q0s:pct(net(std,"Q0")), q1s:pct(net(std,"Q1")), a1s:pct(net(std,"A1")),
    q1u:pct(net(usr,"Q1")), a1u:pct(net(usr,"A1")),
    stdBelow: !!std && net(std,"Q0")<net(std,"A1") && net(std,"Q1")<net(std,"A1"),
    q1AboveUser: !!usr && net(usr,"Q1")>net(usr,"A1")};
  return `<a id="top"></a><section class="hero"><div class="wrap">
    <div class="eyebrow"><i></i><span>${esc(t("eyebrow"))}</span></div>
    <h1>${t("title_html")}</h1>
    <p class="deck">${esc(t("deck"))}</p>
    <div class="readout">${tiles.map(x=>`<div><div class="k">${esc(x.k)}</div><div class="v">${esc(x.v)}</div><div class="s">${esc(x.s)}</div></div>`).join("")}</div>
    <div class="verdict"><span class="tag">${esc(t("verdict_tag"))}</span><p>${esc(t("verdict")(v))}</p></div>
  </div></section>`;
}
function scenarioTabs(){
  return `<div class="tabs" role="tablist">${["standard","user"].map(id=>{ const has=!!scenario(id);
    return `<button type="button" class="tab" role="tab" aria-selected="${id===state.scenario}" data-scenario="${id}"><span>${esc(t("scen")[id])}</span><span class="sub">${esc(t("scen_sub")[id])}${has?"":" · "+esc(t("no_scenario"))}</span></button>`; }).join("")}</div>${(t("scen_note")||{})[state.scenario]?`<p class="cap" style="margin:-12px 0 20px">${esc(t("scen_note")[state.scenario])}</p>`:""}`;
}
function weekSection(base,cw){
  const sc = scenario(state.scenario)||base;
  const w = sc? (sc.weeks.filter(x=>x.pending_outcome).pop()||null) : null;
  if(!sc||!w) return `<section class="block" id="semana"><div class="wrap">${secHead("wk_label",esc(t("wk_title")),"—")}</div></section>`;
  const arch = sc.current_week&&sc.current_week.archived_at||{};
  const latest = Object.values(arch).sort().pop();
  const cols = FC.map(f=>{
    const x = w.forecasters[f]; if(!x) return "";
    const picks = x.picks||[];
    const n = (x.filled||0)+(x.failed||0);
    const entries = `<div class="row"><span>${esc(t("entries"))}</span><b>${esc(t("entries_v")(x.filled,n))}${x.failed?`<span class="chip bad">${x.failed} ${esc(t("no_lot"))}</span>`:`<span class="chip ok">✓</span>`}</b></div>`;
    return `<article class="col"><header><div class="who"><i class="dot ${f}"></i>${esc(t("fc")[f])}</div><div class="how">${esc(t("fc_how")[f])}</div></header>
      <ol class="picks">${picks.map(p=>`<li><span class="sym">${esc(p.symbol)}</span><span class="nm" lang="zh-Hant">${esc(p.name)}</span><span class="mk">${esc(p.market==="TPEX"?"TPEx":p.market)}</span></li>`).join("")}</ol>
      <footer>${entries}<div class="row"><span>${esc(t("wk_universe")(nf(w.eligible||0,0)))}</span><span class="chip">${esc(t("scen")[sc.id])}</span></div></footer></article>`;
  }).join("");
  return `<section class="block" id="semana"><div class="wrap">
    ${secHead("wk_label",esc(t("wk_title")),esc(t("wk_sub")(w.week_id,fmtDateTime(w.cutoff_at))))}
    ${scenarioTabs()}
    <div class="callout"><span class="tag">${esc(t("wk_banner_tag"))}</span>${esc(t("wk_banner")(latest?fmtDateTime(latest):"—"))}</div>
    <div class="board">${cols}</div>
    <p class="cap">${esc(t("wk_scen_note"))} ${esc(t("wk_pending"))}</p>
  </div></section>`;
}
function resultsSection(sc){
  let body;
  if(!sc||sc.id!==state.scenario){ body = `<div class="note">${esc(t("scen_missing"))}</div>`; }
  else body = kpiAndChart(sc)+weeksTable(sc);
  const u = (anyScenario()||{}).universe_size||0;
  return `<section class="block" id="resultados"><div class="wrap">
    ${secHead("res_label",esc(t("res_title")),esc(t("res_sub")(nf(u,0))))}
    ${scenarioTabs()}${body}</div></section>`;
}
function kpiAndChart(sc){
  const K = t("kpi"); const F = sc.forecasters;
  const signed = v=>`<span class="${cls(v)}">${arrow(v)}${esc(pct(v))}</span>`;
  const rows = [
    {label:K.net, cell:x=>signed(x.mean_weekly_net)},
    {label:K.gross, cell:x=>signed(x.mean_weekly_gross_picks)},
    {label:K.costs, cell:x=>esc(pct(x.mean_costs_over_invested,2,false))},
    {label:K.pos, cell:x=>`${x.weeks_positive}/${x.weeks_measured!=null?x.weeks_measured:x.weeks_selected}`},
    {label:K.fail, cell:x=>`${x.entry_failures}/${(x.weeks_selected||0)*(sc.assumptions.slots||5)}`},
    {label:K.eq, cell:x=>{const fl=x.final_flags||[]; return esc(twd(x.final_equity))+(fl.length?` <span class="chip warn" title="${esc(fl.join(", "))}">${esc(t("provisional"))}</span>`:"");}, wrap:true},
    {label:K.tot, cell:x=>signed(x.total_net_return)},
    {label:K.paired, cell:(x,f)=>{const p=x.paired; if(!p||f===sc.assumptions.baseline) return `<span class="flat">—</span>`; const ci=(p.ci95?`<br><span class="chip">${esc(t("paired_ci")(pp(p.ci95[0]),pp(p.ci95[1])))}</span>`:"")+(p.variability_limited?` <span class="chip warn">${esc(t("paired_lim")(p.n_fixed_observations))}</span>`:""); return `<span class="${p.degenerate?"flat":cls(p.mean)}">${esc(t("paired_v")(pp(p.mean),p.n_used,p.degenerate))}</span>${ci}`;}, wrap:true}
  ];
  const table = `<div class="scroll only-wide"><table class="kpi"><colgroup><col class="lbl"><col><col><col></colgroup><thead><tr><th></th>${FC.map(f=>`<th class="num"><span class="chip ${f}">${f}</span></th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)}</td>${FC.map(f=>{const x=F[f]; return x?`<td class="num${r.wrap?" wrap":""}">${r.cell(x,f)}</td>`:"<td class=num>—</td>";}).join("")}</tr>`).join("")}</tbody></table></div>`;
  const cards = `<div class="kcards only-narrow">${FC.map(f=>{const x=F[f]; if(!x) return ""; return `<div class="kcard"><h4><i class="dot ${f}"></i>${esc(t("fc")[f])}</h4>${rows.map(r=>`<div class="kr"><span>${esc(r.label)}</span><span>${r.cell(x,f)}</span></div>`).join("")}</div>`;}).join("")}</div>`;
  const q = F.Q0||F.A1||F.Q1;
  return `<div class="resgrid">
    <div class="card"><h3>${esc(t("kpi_title")(sc.weeks_operated))}</h3>${table}${cards}
      <p class="cap">${esc(t("ew")(pct(sc.universe_ew_mean_weekly_gross)))}</p>${q&&q.final_valued_at?`<p class="cap">${esc(t("valued_at")(fmtDay(q.final_valued_at),fmtPlainDate(q.final_prices_session)))}</p>`:""}<p class="cap">${esc(t("tw_legend"))}</p></div>
    <div class="card"><h3>${esc(t("chart_title"))}</h3>${equityChart(sc)}<div class="legend">${FC.map(f=>`<span><i style="background:var(--${f.toLowerCase()})"></i>${esc(t("fc")[f])}</span>`).join("")}</div><p class="cap">${esc(t("chart_cap"))}</p></div>
  </div>`;
}
function equityChart(sc){
  const weeks = sc.weeks.filter(w=>!w.pending_outcome);
  const series = FC.map(f=>({f,pts:weeks.map((w,i)=>({i,v:w.forecasters[f]&&w.forecasters[f].equity_end,prov:!!(w.forecasters[f]&&(w.forecasters[f].flags||[]).length)})).filter(p=>typeof p.v==="number")}));
  const init = sc.assumptions.initial_cash_twd||0;
  let vals = series.flatMap(s=>s.pts.map(p=>p.v)); vals.push(init);
  if(!vals.length) return "";
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.1||1; lo-=pad; hi+=pad;
  const N=narrow(); const W=N?380:640,H=N?250:300,L=N?44:52,R=N?54:64,T=16,B=30; const iw=W-L-R, ih=H-T-B, n=Math.max(weeks.length-1,1);
  const X=i=>L+iw*i/n, Y=v=>T+ih*(1-(v-lo)/(hi-lo));
  const ticks=[]; for(let k=0;k<=4;k++) ticks.push(lo+(hi-lo)*k/4);
  const grid = ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${esc(twdShort(v))}</text>`).join("");
  const step=N?4:3; const xl = weeks.map((w,i)=> (i%step===0||i===weeks.length-1)?`<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(w.week_id.slice(5))}</text>`:"").join("");
  const initLine = `<line x1="${L}" x2="${W-R}" y1="${Y(init).toFixed(1)}" y2="${Y(init).toFixed(1)}" stroke="var(--fog)" stroke-dasharray="2 4" stroke-width="1"/>`;
  const ends = series.filter(s=>s.pts.length).map(s=>({f:s.f,y:Y(s.pts[s.pts.length-1].v),v:s.pts[s.pts.length-1].v,x:X(s.pts[s.pts.length-1].i)})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++){ if(ends[k].y-ends[k-1].y<13) ends[k].y=ends[k-1].y+13; }
  const paths = series.map(s=>{ if(!s.pts.length) return ""; const col=`var(--${s.f.toLowerCase()})`; let out="";
    for(let k=1;k<s.pts.length;k++){ const a=s.pts[k-1], b=s.pts[k]; const dash=(a.prov||b.prov)?` stroke-dasharray="3 3"`:"";
      out+=`<line x1="${X(a.i).toFixed(1)}" y1="${Y(a.v).toFixed(1)}" x2="${X(b.i).toFixed(1)}" y2="${Y(b.v).toFixed(1)}" stroke="${col}" stroke-width="1.7" stroke-linecap="round"${dash}/>`; }
    for(const p of s.pts){ if(p.prov) out+=`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.2" fill="var(--surface)" stroke="${col}" stroke-width="1.5"><title>${esc(weeks[p.i].week_id)}: ${esc((weeks[p.i].forecasters[s.f].flags||[]).join(", "))}</title></circle>`; }
    const last=s.pts[s.pts.length-1]; if(!last.prov) out+=`<circle cx="${X(last.i).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="3" fill="${col}"/>`;
    return out; }).join("");
  const labels = ends.map(e=>`<text x="${(W-R+8).toFixed(1)}" y="${(e.y+3.5).toFixed(1)}" style="fill:var(--${e.f.toLowerCase()})">${esc(e.f)} ${esc(twdShort(e.v))}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("chart_title"))}"><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>${grid}${initLine}${paths}${labels}${xl}</svg>`;
}
function weeksTable(sc){
  const TH = t("th"); const ST = t("st");
  const head = `<tr><th></th><th>${esc(TH.week)}</th><th>${esc(TH.cutoff)}</th><th class="num">${esc(TH.elig)}</th><th class="num">${esc(TH.ew)}</th>${FC.map(f=>`<th class="num">${esc(TH.net(f))}</th>`).join("")}<th>${esc(TH.status)}</th></tr>`;
  const rows = sc.weeks.map(w=>{
    const open = state.open.has(w.week_id);
    const closure = (sc.weeks_extraordinary_closure_unhandled||[]).includes(w.week_id);
    const status = w.pending_outcome?`<span class="chip warn">${esc(ST.pending)}</span>`:closure?`<span class="chip warn">${esc(ST.closure)}</span>`:w.status!=="valid"?`<span class="chip">${esc((t("status_reason")||{})[w.status]||w.status)}</span>`:"";
    const cell = f=>{ const x=w.forecasters[f]; if(!x) return `<td class="num flat">—</td>`; if(w.pending_outcome) return `<td class="num flat">…</td>`; const v=x.net; const abst=x.status!=="selected"?` <span class="chip" title="${esc(ST.nosel)}">${esc(ST.nosel)}</span>`:""; if(typeof v!=="number") return `<td class="num flat">—${abst}</td>`; return `<td class="num ${cls(v)}">${arrow(v)}${esc(pct(v))}${x.failed?` <span class="chip bad" title="${esc(t("no_lot"))}">−${x.failed}</span>`:""}${abst}</td>`; };
    const main = `<tr class="wk${open?" open":""}" data-week="${esc(w.week_id)}" tabindex="0" aria-expanded="${open}"><td><span class="caret">▸</span></td><td class="mono">${esc(w.week_id)}</td><td>${esc(fmtDay(w.cutoff_at))}</td><td class="num">${nf(w.eligible||0,0)}</td><td class="num ${w.pending_outcome?"flat":cls(w.ew_gross)}">${w.pending_outcome?"…":arrow(w.ew_gross)+esc(pct(w.ew_gross))}</td>${FC.map(cell).join("")}<td>${status}</td></tr>`;
    const detail = `<tr class="detail" data-detail="${esc(w.week_id)}"${open?"":" hidden"}><td colspan="${6+FC.length}"><div class="dgrid">${FC.map(f=>pickList(w,f)).join("")}</div></td></tr>`;
    return main+detail;
  }).join("");
  return `<div class="card weeks"><h3 style="margin-bottom:4px">${esc(t("weeks_title"))}</h3><p class="cap" style="margin:0 0 12px">${esc(t("weeks_hint"))}</p><div class="scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>`;
}
function pickList(w,f){
  const x = w.forecasters[f]; const PS=t("pick_status"), RS=t("reason");
  if(!x) return "";
  const items = (x.picks||[]).map(p=>{
    const st = p.entry_status||(w.pending_outcome?"pending":"");
    const chip = st? `<span class="chip ${st==="entry_failed"?"bad":st==="exited"||st==="filled"?"":"warn"}">${esc(PS[st]||st)}${p.entry_reason?" · "+esc(RS[p.entry_reason]||p.entry_reason):""}</span>`:"";
    const g = typeof p.gross_return==="number"?`<span class="num ${cls(p.gross_return)}">${arrow(p.gross_return)}${esc(pct(p.gross_return))}</span>`:chip;
    return `<li><span class="mono">${esc(p.symbol)}</span><span class="nm" lang="zh-Hant">${esc(p.name)}${typeof p.gross_return==="number"&&st==="entry_failed"?" "+chip:""}</span>${g}</li>`;
  }).join("");
  const sub = x.status==="selected"? (w.pending_outcome?"":`${esc(t("th").gross)} ${esc(pct(x.gross_picks))} · ${esc(t("th").net(f))} ${esc(pct(x.net))}${x.paired===false&&x.unpaired_reason?` · <span class="chip">${esc(RS[x.unpaired_reason]||x.unpaired_reason)}</span>`:""}`) : esc(statusReason(x))+(typeof x.net==="number"?` · ${esc(t("th").net(f))} ${esc(pct(x.net))}`:"");
  return `<div class="f"><h4><i class="dot ${f}"></i>${esc(t("fc")[f])}</h4><ul>${items||`<li>${esc(t("st").nosel)}</li>`}</ul><p class="cap" style="margin-top:8px">${sub}</p></div>`;
}
function howSection(){
  const steps = t("steps").map(s=>`<div class="step"><div class="pt"></div><div class="when">${esc(s.when)}</div><h4>${esc(s.h)}</h4><p>${esc(s.p)}</p></div>`).join("");
  const cards = FC.map(f=>`<div class="card"><h3><i class="dot ${f}"></i>${esc(t("fc")[f])}</h3><p>${esc(t("fc_cards")[f])}</p></div>`).join("");
  const ctl = t("controls").map(c=>`<div><b>${esc(c.b)}</b><p>${esc(c.p)}</p></div>`).join("");

    <div class="roles">${roles}</div>
  </div></section>`;
}
function reviewSection(rounds){
  const SEV = ["bloqueante","alta","media","baja"];
  const first = rounds[0]||{findings_new:0,severity:{}}, last = rounds[rounds.length-1]||{findings_new:0};
  const total = rounds.reduce((a,r)=>a+(r.findings_new||0),0);
  const K = t("rev_k"); const RS = DATA.review_stats||{};
  const list = rounds.map(r=>{
    const bar = SEV.map(s=>{const n=r.severity[s]||0; return n?`<i class="sev-${s}" style="width:${n*7}px" title="${esc(t("sev")[s])}: ${n}"></i>`:"";}).join("");
    const sevtxt = SEV.filter(s=>r.severity[s]).map(s=>`${r.severity[s]} ${esc(t("sev")[s])}`).join(" · ");
    return `<div class="round"><div class="n"><small>${esc(t("round_word"))}</small>${r.round}</div><div>
      <div class="meta"><span class="chip ${r.verdict==="rechazado"?"warn":"ok"}">${esc(t("verdicts")[r.verdict]||r.verdict)}</span><span>${esc(t("new_findings")(r.findings_new))}</span><span class="sevbar">${bar}</span><span>${sevtxt}</span></div>
      ${state.lang==="es"?`<p class="sum">${esc(r.summary||"")}</p>`:`<details class="orig"><summary>${esc(t("orig_summary"))}</summary><p class="sum" lang="es">${esc(r.summary||"")}</p></details>`}
      <p class="links"><a href="${esc(gh(r.file))}">${esc(t("astra_out"))} ↗</a>${r.response?`<a href="${esc(gh(r.response))}">${esc(t("response"))} ↗</a>`:""}</p>
    </div></div>`;
  }).join("");
  return `<section class="block" id="revision"><div class="wrap">
    ${secHead("rev_label",esc(t("rev_title")(rounds.length,verdictCounts(rounds))),esc(t("rev_sub")))}
    <div class="revgrid">
      <div class="card"><h3>${esc(t("rev_chart"))}</h3>${findingsChart(rounds)}<div class="sevlegend">${SEV.map(s=>`<span><i class="sev-${s}"></i>${esc(t("sev")[s])}</span>`).join("")}</div><p class="cap">${esc(t("rev_cap")(first.findings_new,first.severity.bloqueante||0,last.findings_new,lastBlockingRound(rounds)))}</p></div>
      <div class="card side">
        <div><div class="k">${esc(K.total)}</div><div class="v">${nf(RS.new_total!=null?RS.new_total:total,0)}</div><div class="s">${esc(t("st_rounds_s")(rounds.length,verdictCounts(rounds)))}</div></div>
        <div><div class="k">${esc(K.verified)}</div><div class="v">${RS.verified_total!=null?nf(RS.verified_total,0):"—"}</div><div class="s">${RS.unverified_ids?esc(RS.unverified_ids.slice(0,6).join(" · "))+(RS.unverified_ids.length>6?" …":""):""}</div></div>
        <div><div class="k">${esc(K.block)}</div><div class="v">${RS.blocking_new!=null?`${nf(RS.blocking_new,0)} · ${nf(RS.blocking_verified,0)}`:"—"}</div><div class="s">${esc(t("sev").bloqueante)}</div></div>
        <div><div class="k">${esc(K.last)}</div><div class="v">${last.findings_new}</div><div class="s">${(last.severity||{}).alta||0} ${esc(t("sev").alta)} · ${(last.severity||{}).media||0} ${esc(t("sev").media)}</div></div>
      </div>
    </div>
    <p class="cap" style="margin-top:20px">${esc(t("rev_lang"))}</p>
    <div class="rounds">${list}</div>
  </div></section>`;
}
function findingsChart(rounds){
  if(!rounds.length) return "";
  const SEV = ["baja","media","alta","bloqueante"];
  const N=narrow(); const W=N?380:640,H=N?190:220,L=28,R=6,T=14,B=24; const iw=W-L-R, ih=H-T-B;
  const max = Math.max(5,...rounds.map(r=>r.findings_new));
  const bw = iw/rounds.length, gap = Math.min(12,bw*0.34);
  const Y = v=>T+ih*(1-v/max);
  const ticks=[0,Math.round(max/2),max];
  const grid = ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const bars = rounds.map((r,i)=>{ let acc=0; const x=L+i*bw+gap/2, w=bw-gap; const segs=SEV.map(s=>{const n=r.severity[s]||0; if(!n) return ""; const y1=Y(acc+n), y0=Y(acc); acc+=n; return `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,(y0-y1)-1).toFixed(1)}" rx="1" style="fill:var(--sev-${({bloqueante:"block",alta:"high",media:"mid",baja:"low"})[s]})"/>`;}).join("");
    return segs+`<text x="${(x+w/2).toFixed(1)}" y="${(Y(r.findings_new)-5).toFixed(1)}" text-anchor="middle" style="fill:var(--ink-2)">${r.findings_new}</text><text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${r.round}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("rev_chart"))}">${grid}${bars}</svg>`;
}
function dataSection(base){
  const rc = DATA.raw_coverage||{}; const m = DATA.master||{};
  const d = {tw:nf((rc.twse||{}).sessions||0,0), tp:nf((rc.tpex||{}).sessions||0,0), first:fmtPlainDate((rc.twse||{}).first), last:fmtPlainDate((rc.twse||{}).last), seg:nf(m.segments||0,0), uni:nf(base?base.universe_size:0,0), asof:fmtPlainDate(m.as_of)};
  const facts = t("facts")(d).map(f=>`<div><b>${esc(f.b)}</b><p>${esc(f.p)}</p></div>`).join("");
  return `<section class="block" id="datos"><div class="wrap">${secHead("data_label",esc(t("data_title")),esc(t("data_sub")))}<div class="facts">${facts}</div></div></section>`;
}

    <div class="two"><div><h3>${esc(t("next_you"))}</h3><ol>${a}</ol></div><div><h3>${esc(t("next_lab"))}</h3><ol>${b}</ol></div></div></div></section>`;

function docsSection(){
  const D = DATA.docs||{informes:[],spec:[]};
  const inf = D.informes.map(d=>`<li><span><a href="${esc(gh(d.file))}">${esc(docTitle(d))}</a> <span class="mono">${esc(d.file.split("/").pop())}</span></span></li>`).join("");
  const spec = D.spec.map(d=>`<li><span><a href="${esc(gh(d.file))}" class="mono">${esc(d.file.split("/").pop())}</a></span></li>`).join("");
  const cmd = `python -m pip install -e ".[dev,model]"\npython -m pytest -q -p no:cacheprovider\npython scripts/fetch_universe_daily.py --start 2024-07-01\npython scripts/run_backtest.py --manifest daily --lookback-start 2024-07-01 \\\n  --start 2026-05-04 --end 2026-09-09 --forecasters Q0,Q1,A1 --min-train-weeks 40\npython scripts/export_site_data.py`;
  return `<section class="block" id="documentos"><div class="wrap">${secHead("docs_label",esc(t("docs_title")),esc(t("docs_sub")))}
    <div class="two">
      <div><h3>${esc(t("docs_informes"))}</h3><ol>${inf}</ol></div>
      <div><h3>${esc(t("docs_spec"))}</h3><ol>${spec}</ol>
        <h3 style="margin-top:32px">${esc(t("docs_review"))}</h3><ol><li><span><a href="${esc((DATA.repo||"#")+"/tree/main/review/out")}" class="mono">review/out/</a></span></li></ol>
        <h3 style="margin-top:32px">${esc(t("docs_code"))}</h3><p style="font-size:.9rem;color:var(--fog);margin-top:8px">${esc(t("docs_code_p"))}</p><div class="cmd">${esc(cmd)}</div></div>
    </div></div></section>`;
}
function footer(){
  return `<footer class="foot"><div class="wrap"><p>${esc(t("foot1"))}</p><p>${esc(t("foot2")(fmtDateTime(DATA.generated_at)))} <a href="${esc(DATA.repo||"#")}">${esc(t("repo"))} ↗</a></p></div></footer>`;
}

/* ---------- interaction ---------- */
function wire(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{ state.lang=b.dataset.lang; try{localStorage.setItem("twlab.lang",state.lang);}catch(e){} render(); }));
  document.querySelectorAll("[data-scenario]").forEach(b=>b.addEventListener("click",()=>{ const inResults=!!b.closest("#resultados"); const y=scrollY; state.scenario=b.dataset.scenario; render(); if(inResults){ const el=document.getElementById("resultados"); if(el) el.scrollIntoView({block:"start"}); } else { scrollTo(0,y); } }));
  const th=document.getElementById("theme"); if(th) th.addEventListener("click",()=>{ const root=document.documentElement; const light = root.dataset.theme==="light" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: light)").matches); root.dataset.theme = light?"dark":"light"; try{localStorage.setItem("twlab.theme",root.dataset.theme);}catch(e){} });
  const toggle = tr=>{ const id=tr.dataset.week; const det=document.querySelector(`[data-detail="${CSS.escape(id)}"]`); if(!det) return; const open=!state.open.has(id); if(open) state.open.add(id); else state.open.delete(id); det.hidden=!open; tr.classList.toggle("open",open); tr.setAttribute("aria-expanded",open); };
  document.querySelectorAll("tr.wk").forEach(tr=>{ tr.addEventListener("click",()=>toggle(tr)); tr.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(tr);} }); });
}
try{ const th=localStorage.getItem("twlab.theme"); if(th==="dark"||th==="light") document.documentElement.dataset.theme=th; }catch(e){}
state.lang = detectLang();
render();
let _wasNarrow = narrow(); let _rt = null;
addEventListener("resize", ()=>{ clearTimeout(_rt); _rt = setTimeout(()=>{ const n=narrow(); if(n!==_wasNarrow){ _wasNarrow=n; render(); } }, 150); });
})();
